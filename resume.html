<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live IPL Scores</title>
  <link rel="stylesheet" href="styles.css">
</head>
<head>
    <Style>
        body {
  font-family: Arial, sans-serif;
  background-color: #f4f4f9;
  margin: 0;
  padding: 0;
}

.container {
  width: 80%;
  margin: 0 auto;
}

header {
  background-color: #0275d8;
  color: white;
  padding: 20px;
  text-align: center;
}

.scores {
  background-color: white;
  border: 1px solid #ddd;
  padding: 20px;
  margin-top: 20px;
}

.score {
  padding: 10px;
  margin-bottom: 10px;
  background-color: #f9f9f9;
  border-radius: 5px;
}

footer {
  text-align: center;
  margin-top: 30px;
}

    </Style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Live IPL Scores</h1>
    </header>
    <div id="live-scores" class="scores">
      <!-- Live scores will be updated here -->
    </div>
    <footer>
      <p>&copy; 2025 IPL Scores</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
